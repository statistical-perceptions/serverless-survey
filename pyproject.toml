[project]
name = "serverlesssurvey"
version = "0.4.0"
requires-python = ">=3.9"
dependencies = [
    "click",
    "pandas",
    "lxml",
    "plotly",
    "requests",
    "html5lib",
    "markdown",
    "scipy",
    "pyyaml",
    "numpy",
]

[project.scripts]
ss            = "ssbuilder.cli:cli"
ssgeneratehtml = "ssbuilder.cli:generate"
sslengthcheck  = "ssbuilder.cli:check"
ssmergedir     = "ssbuilder.cli:merge"
ssmetadata     = "ssbuilder.cli:metadata"

[tool.setuptools.packages.find]
where = ["."]
include = ["ssbuilder*"]

[tool.setuptools.package-data]
"ssbuilder.assets" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
